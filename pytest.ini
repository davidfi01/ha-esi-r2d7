[pytest]
# Review harness. Needs Python >= 3.14.2, homeassistant==2026.11.2, pytest-homeassistant (same release),
# serialx==1.15.1, and the esphome integration's requirements. Uses loopback sockets only - no hardware.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -p no:respx -p no:cacheprovider
pythonpath = .
testpaths = tests_review
ha_test_config_dir = .
